version: "3.9"

# ─── FundusView — docker compose up ──────────────────────────────────
# Starts:  frontend (React/Vite → Nginx on :80)
#          backend  (FastAPI/Uvicorn on :8000)
#
# Visit:   http://localhost
# API:     http://localhost/api/health
# ────────────────────────────────────────────────────────────────────

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fundusview

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"        # also reachable directly for dev/testing
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fundusview

  # ── PostgreSQL (schema-ready, wired up in a later phase) ──────────
  # Uncomment when ready to persist image metadata and annotations.
  #
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB:       fundusview
  #     POSTGRES_USER:     fv_user
  #     POSTGRES_PASSWORD: fv_pass
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  #   networks:
  #     - fundusview
  #
  # volumes:
  #   pgdata:

networks:
  fundusview:
    driver: bridge
